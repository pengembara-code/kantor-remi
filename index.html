function computeStatus(){
  const now=new Date(),out={};
  EMPLOYEES.forEach(emp=>{
    const entries=USAGE_DATA.filter(e=>e.model===emp.id).sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    let st='istirahat',last='Belum ada aktivitas';
    if(entries.length){
      const e=entries[0],d=new Date(e.ts);
      last='aktif '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
      const mins=(now-d)/60000;
      if(e.ok===false)st='limit';
      else if(mins<=10)st='kerja';
    }
    out[emp.id]={status:st,last};
  });
  return out;
}

// ===== SPRITE TEKS (nameplate & simbol) =====
function textSprite(lines,opts={}){
  const c=document.createElement('canvas');c.width=512;c.height=160;
  const g=c.getContext('2d');
  g.fillStyle=opts.bg||'rgba(20,14,12,.82)';
  g.beginPath();g.roundRect(6,6,500,148,26);g.fill();
  g.strokeStyle=opts.border||'#ffb703';g.lineWidth=6;
  g.beginPath();g.roundRect(6,6,500,148,26);g.stroke();
  g.textAlign='center';g.fillStyle=opts.fg||'#fff';
  g.font='bold 52px sans-serif';
  g.fillText(lines[0],256,lines[1]?72:100);
  if(lines[1]){g.font='bold 40px sans-serif';g.fillStyle=opts.fg2||'#ffd23f';g.fillText(lines[1],256,128)}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));
  s.scale.set(2.6,.82,1);return s;
}
function symbolSprite(txt,color,size=1){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const g=c.getContext('2d');g.font='bold 92px sans-serif';g.textAlign='center';
  g.shadowColor=color;g.shadowBlur=18;g.fillStyle=color;g.fillText(txt,64,96);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));
  s.scale.set(size,size,1);return s;
}

// ===== KARAKTER CHIBI IMUT =====
function makeChibi(colorHex,isManager=false){
  const g=new THREE.Group();
  const refs={};
  const cm=new THREE.MeshStandardMaterial({color:colorHex,roughness:.55});
  const s=isManager?1.25:1;
  // badan
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34*s,.42*s,6,14),cm);
  body.position.y=.62*s;body.castShadow=true;g.add(body);refs.body=body;
  // dasi manager
  if(isManager){
    const tie=new THREE.Mesh(new THREE.BoxGeometry(.12,.3,.06),
      new THREE.MeshStandardMaterial({color:0xfee440,roughness:.5}));
    tie.position.set(0,.72*s,.36*s);g.add(tie);
  }
  // kepala
  const headG=new THREE.Group();headG.position.y=1.32*s;g.add(headG);refs.head=headG;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.44*s,24,20),M.skin);
  head.castShadow=true;headG.add(head);
  // mata: kiri bulat, kanan kedip — ciri khas Remi 😉
  const eyeG=new THREE.SphereGeometry(.07*s,12,10);
  const eL=new THREE.Mesh(eyeG,M.black);eL.position.set(-.16*s,.06*s,.38*s);headG.add(eL);
  const wink=new THREE.Mesh(new THREE.TorusGeometry(.06*s,.018*s,8,12,Math.PI),M.black);
  wink.position.set(.17*s,.06*s,.385*s);wink.rotation.z=-Math.PI/2;headG.add(wink);
  refs.eyeL=eL;refs.eyeR=wink;
  // blush
  const blG=new THREE.SphereGeometry(.055*s,10,8);
  const bL=new THREE.Mesh(blG,M.pink);bL.position.set(-.28*s,-.08*s,.33*s);bL.scale.z=.4;headG.add(bL);
  const bR=new THREE.Mesh(blG,M.pink);bR.position.set(.28*s,-.08*s,.33*s);bR.scale.z=.4;headG.add(bR);
  // mulut (senyum)
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.09*s,.022*s,8,14,Math.PI),
    M.black);
  mouth.position.set(0,-.14*s,.4*s);mouth.rotation.x=Math.PI;headG.add(mouth);refs.mouth=mouth;
  // rambut pink khas Remi 💗
  const hairM=new THREE.MeshStandardMaterial({color:0xff8fc7,roughness:.55});
  const hairBack=new THREE.Mesh(new THREE.SphereGeometry(.46*s,20,16),hairM);
  hairBack.position.set(0,.04*s,-.18*s);hairBack.scale.set(1,1.08,.8);
  hairBack.castShadow=true;headG.add(hairBack);
  const hairTop=new THREE.Mesh(
    new THREE.SphereGeometry(.47*s,24,14,0,Math.PI*2,0,Math.PI*.5),hairM);
  hairTop.position.set(0,.09*s,-.02*s);hairTop.castShadow=true;headG.add(hairTop);
  const lockG=new THREE.CapsuleGeometry(.07*s,.2*s,4,8);
  const lkL=new THREE.Mesh(lockG,hairM);lkL.position.set(-.43*s,-.1*s,.08*s);lkL.rotation.z=.12;headG.add(lkL);
  const lkR=new THREE.Mesh(lockG,hairM);lkR.position.set(.43*s,-.1*s,.08*s);lkR.rotation.z=-.12;headG.add(lkR);
  // antena lucu (tetap, jadi jepit rambut AI 🤖)
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(.02*s,.02*s,.3*s,8),M.black);
  ant.position.set(.12*s,.6*s,-.05*s);headG.add(ant);
  const antTip=new THREE.Mesh(new THREE.SphereGeometry(.06*s,10,8),
    new THREE.MeshStandardMaterial({color:colorHex,emissive:colorHex,emissiveIntensity:.7}));
  antTip.position.set(.12*s,.76*s,-.05*s);headG.add(antTip);refs.antTip=antTip;
  // lengan (pivot di bahu)
  function arm(side){
    const pivot=new THREE.Group();pivot.position.set(side*.36*s,.82*s,0);g.add(pivot);
    const a=new THREE.Mesh(new THREE.CapsuleGeometry(.09*s,.3*s,4,10),cm);
    a.position.y=-.2*s;a.castShadow=true;pivot.add(a);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.09*s,10,8),M.skin);
    hand.position.y=-.4*s;pivot.add(hand);
    return pivot;
  }
  refs.armL=arm(-1);refs.armR=arm(1);
  // kaki mungil
  const legG=new THREE.CapsuleGeometry(.1*s,.18*s,4,8);
  const lL=new THREE.Mesh(legG,M.black);lL.position.set(-.15*s,.14*s,0);g.add(lL);
  const lR=new THREE.Mesh(legG,M.black);lR.position.set(.15*s,.14*s,0);g.add(lR);
  // Zzz (tidur)
  refs.zzz=[];
  for(let i=0;i<3;i++){
    const z=symbolSprite('Z','#90e0ef',.5);z.visible=false;z.position.set(.6,2.1+i*.35,.2);
    z.userData.phase=i*.7;g.add(z);refs.zzz.push(z);
  }
  // "?" (error)
  const q=symbolSprite('?','#ff5964',.8);q.visible=false;q.position.set(0,2.5,0);g.add(q);refs.q=q;
  // "!" kerja
  const exc=symbolSprite('!','#52b788',.55);exc.visible=false;exc.position.set(-.75,2.2,0);g.add(exc);refs.exc=exc;
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  return {group:g,refs,s};
}

// ===== MEJA + LAPTOP =====
function makeDesk(w=2.2){
  const g=new THREE.Group();
  const top=new THREE.Mesh(new THREE.BoxGeometry(w,.14,1.1),M.wood);
  top.position.y=.95;top.castShadow=true;top.receiveShadow=true;g.add(top);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.12,.95,.12),M.woodDark);
    leg.position.set(sx*(w/2-.1),.475,sz*.45);leg.castShadow=true;g.add(leg);
  });
  // laptop
  const lap=new THREE.Group();lap.position.set(0,1.02,-.1);lap.rotation.y=Math.PI;g.add(lap);
  const base=new THREE.Mesh(new THREE.BoxGeometry(.7,.05,.5),
    new THREE.MeshStandardMaterial({color:0xd3d3d3,roughness:.4}));
  base.position.y=.03;lap.add(base);
  const scrMat=new THREE.MeshStandardMaterial({color:0x111111,emissive:0x000000,emissiveIntensity:1});
  const scr=new THREE.Mesh(new THREE.BoxGeometry(.7,.45,.04),scrMat);
  scr.position.set(0,.26,-.24);scr.rotation.x=-.25;lap.add(scr);
  // mug kopi
  const mug=new THREE.Mesh(new THREE.CylinderGeometry(.09,.075,.16,12),
    new THREE.MeshStandardMaterial({color:0xf4eee2,roughness:.5}));
  mug.position.set(w/2-.35,1.1,.25);mug.castShadow=true;g.add(mug);
  return {group:g,screenMat:scrMat};
}

// ===== ANIMASI =====
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  actors.forEach(a=>{
    const {refs,s}=a,grp=a.group;
    // reset umum
    refs.q.visible=false;refs.exc.visible=false;refs.zzz.forEach(z=>z.visible=false);
    if(a.status==='kerja'){
      // ngetik semangat di depan meja
      grp.position.y=a.baseY+Math.abs(Math.sin(t*4+a.seed))*.06;
      refs.head.rotation.x=Math.sin(t*4+a.seed)*.06;
      refs.head.rotation.z=0;
      refs.armL.rotation.x=-.85+Math.sin(t*11+a.seed)*.3;
      refs.armR.rotation.x=-.85+Math.sin(t*11+a.seed+Math.PI)*.3;
      refs.armL.rotation.z=.25;refs.armR.rotation.z=-.25;
      refs.exc.visible=true;refs.exc.position.y=2.2+Math.sin(t*5)*.08;
      a.scrMat.emissive.setHex(0x00b4d8);a.scrMat.emissiveIntensity=1.4;
      refs.antTip.material.emissiveIntensity=1.2;
      refs.mouth.rotation.x=Math.PI; // senyum
    }else if(a.status==='limit'){
      // garuk-garuk kepala kebingungan
      grp.position.y=a.baseY;
      grp.rotation.z=Math.sin(t*7+a.seed)*.03;
      refs.head.rotation.z=.28+Math.sin(t*3+a.seed)*.05;
      refs.head.rotation.x=0;
      refs.armL.rotation.x=.2;refs.armL.rotation.z=.35;
      refs.armR.rotation.z=-2.1+Math.sin(t*9)*.18; // tangan di kepala
      refs.armR.rotation.x=Math.sin(t*9)*.22;      // garuk-garuk!
      refs.q.visible=true;
      const qp=1+Math.sin(t*6)*.15;refs.q.scale.set(.8*qp,.8*qp,1);
      a.scrMat.emissive.setHex(0xe63946);a.scrMat.emissiveIntensity=1+.6*Math.sin(t*8);
      refs.mouth.rotation.x=0; // mulut manyun (torus dibalik)
      refs.mouth.position.y=-.1*s;
    }else{
      // istirahat: napas pelan + Zzz
      grp.position.y=a.baseY;
      grp.rotation.z=0;
      const br=1+Math.sin(t*1.6+a.seed)*.025;
      refs.body.scale.set(1,br,1);
      refs.head.rotation.x=.38;refs.head.rotation.z=Math.sin(t*1.6+a.seed)*.06;
      refs.armL.rotation.x=.15;refs.armL.rotation.z=.15;
      refs.armR.rotation.x=.15;refs.armR.rotation.z=-.15;
      refs.zzz.forEach(z=>{z.visible=true;
        const ph=(t*.7+z.userData.phase)%2;
        z.position.y=2.1+ph*.8;z.material.opacity=1-ph/2;});
      a.scrMat.emissive.setHex(0x000000);a.scrMat.emissiveIntensity=0;
      refs.antTip.material.emissiveIntensity=.25;
    }
  });
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
animate();
document.getElementById('loading').style.display='none';
